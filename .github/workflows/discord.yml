
name: refresh discord status

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: update timestamp
        run: |
          sed -i -E \
            's/([?&]t=)[0-9]+/\1'"$(date +%s)"'/' README.md

      - name: commit changes
        run: |
          if git diff --quiet; then
            echo "nothing to update"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "refresh discord status cache"
          git push
